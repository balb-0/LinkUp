<div class="w-full max-w-screen-xl mx-auto" role="table" aria-label="Tabela de profissionais cadastrados">
  <!-- Cabeçalho da tabela -->
  <div class="flex bg-gray-100 text-gray-800 font-bold py-3 px-6 rounded-t-lg" role="row">
    <ng-container *ngFor="let column of columns; let isFirst = first; let isLast = last">
      <div role="columnheader" [ngClass]="{
          'w-1/2': columns.length === 2,
          'w-1/3': columns.length === 3,
          'w-1/4': columns.length === 4,
          'w-full': columns.length === 1,
          'flex-1': columns.length > 4,
          'text-left': isFirst,
          'text-right': isLast,
          'text-center': !isFirst && !isLast
        }">
        <span>{{ column.header }}</span>
      </div>
    </ng-container>
  </div>

  <div *ngFor="let item of paginatedData"
    class="flex items-center border border-gray-200 rounded-md mb-2 py-4 px-6 hover:bg-gray-50 transition-colors"
    role="row" tabindex="0" (keydown.enter)="onRowClick(item)" (click)="onRowClick(item)"
    [attr.aria-label]="columns.length > 0 ? 'Clique para visualizar o perfil do profissional de nome ' + item[columns[0].key] : 'Clique para visualizar o perfil do profissional'">
    <ng-container *ngFor="let column of columns; let isFirst = first; let isLast = last">
      <div role="cell" [ngClass]="{
          'w-1/2': columns.length === 2,
          'w-1/3': columns.length === 3,
          'w-1/4': columns.length === 4,
          'w-full': columns.length === 1,
          'flex-1': columns.length > 4,
          'text-left': isFirst,
          'text-right': isLast,
          'text-center': !isFirst && !isLast
        }">
        <span class="text-gray-700">{{ item[column.key] }}</span>
      </div>
    </ng-container>
  </div>

  <!-- Nenhum dado encontrado -->
  <div *ngIf="paginatedData.length === 0" class="text-center py-6 text-gray-500" role="row">
    Nenhum dado encontrado.
  </div>

  <!-- Paginador -->
  <mat-paginator [length]="serverPagination ? totalItems : data.length" [pageSize]="pageSize" [hidePageSize]="true"
    (page)="onPageChange($event)" aria-label="Selecione a página da tabela de profissionais"
    class="!font-poppins border !bg-cinza border-gray-200 rounded-md">
  </mat-paginator>
</div>
