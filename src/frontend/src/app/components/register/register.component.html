<div class="register-container">
  <h2>Cadastro</h2>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit($event)">
    <label for="nome">Nome</label>
    <input id="nome" formControlName="nome" type="text" required />
    <div *ngIf="registerForm.controls['nome'].invalid && registerForm.controls['nome'].touched">
      Nome é obrigatório e deve ter pelo menos 3 caracteres.
    </div>

    <label for="email">Email</label>
    <input id="email" formControlName="email" type="email" required />
    <div *ngIf="registerForm.controls['email'].invalid && registerForm.controls['email'].touched">
      Insira um email válido.
    </div>

    <label for="senha">Senha</label>
    <input id="senha" formControlName="senha" type="password" required />
    <div *ngIf="registerForm.controls['senha'].invalid && registerForm.controls['senha'].touched">
      A senha deve ter pelo menos 6 caracteres.
    </div>

    <label for="cargo">Cargo</label>
    <select id="cargo" formControlName="cargo">
      <option value="">Selecione um cargo</option>
      <option value="admin">Admin</option>
      <option value="usuario">Usuário</option>
    </select>
    <div *ngIf="registerForm.controls['cargo'].invalid && registerForm.controls['cargo'].touched">
      Selecione um cargo.
    </div>

    <button type="submit" (click)="onSubmit($event)">Registrar</button>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
  </form>
</div>
