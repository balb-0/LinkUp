<div class="date-time-picker">
  <!-- Campo de Data -->
  <mat-form-field appearance="fill" class="date-field">
    <mat-label>Data</mat-label>
    <input matInput [matDatepicker]="picker" [(ngModel)]="value" (ngModelChange)="onDateSelected()" name="date">
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>


  <!-- Campo de Hora -->
  <mat-form-field appearance="fill" class="time-field">
    <mat-label>Hora</mat-label>
    <input matInput type="time" placeholder="HH:MM" [(ngModel)]="timeValue" (change)="onDateSelected()">
  </mat-form-field>
</div>
