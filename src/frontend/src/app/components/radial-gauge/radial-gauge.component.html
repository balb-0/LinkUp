<div class="w-[586px] h-[456px] rounded-lg border border-[#9FA2BA]">
  <div class="p-0">
    <div class="relative p-3.5">
      <h2 class="relative pb-0.5 font-bold text-[#222222] text-2xl text-center border-b-2 border-[#B20000]">
        {{ label }}
      </h2>
    </div>

    <!-- Dropdown integrado -->
    <div class="flex justify-center items-center">
      <app-drop-down 
        [items]="opcoes"
        [selectedItem]="selecionado"
        (itemSelected)="onItemSelecionado($event)">
      </app-drop-down>
    </div>

    <!-- Gauge -->
    <div class="w-[586px] h-[456px] h-full flex-col align-middle flex justify-center items-center">
      <apx-chart
        [series]="chartOptions.series"
        [chart]="chartOptions.chart"
        [plotOptions]="chartOptions.plotOptions"
        [fill]="chartOptions.fill"
        [labels]="chartOptions.labels">
      </apx-chart>
    </div>
  </div>
</div>
