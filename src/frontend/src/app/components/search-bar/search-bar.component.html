<div class="flex justify-between items-center w-full gap-4 pb-4">
  <div class="flex-1 bg-cinza rounded-lg flex items-center px-4 py-2">
    <input
      [(ngModel)]="searchText"
      type="text"
      placeholder="Pesquisar"
      class="w-full bg-transparent border-none outline-none text-gray-700"
    />
    <mat-icon class="text-gray-500">search</mat-icon>
  </div>
  <button
    mat-button
    class="!bg-verde !font-poppins !font-bold !text-branco !text-[20px] px-8 py-2 !rounded-md"
  >
    Pesquisar
  </button>
</div>
