<div class="flex justify-between items-center w-full gap-4 pb-4">
  <div class="flex-1 bg-cinza rounded flex items-center px-4 py-2">
    <input
      [(ngModel)]="searchText"
      type="text"
      placeholder="Pesquisar"
      aria-label="Pesquisar profissional pelo nome ou e-mail"
      class="w-full bg-transparent border-none outline-none text-gray-700"
      (input)="onInputChange()"
    />
    <mat-icon
      class="text-gray-500"
      aria-hidden="true"
    >
      search
    </mat-icon>
  </div>
</div>
