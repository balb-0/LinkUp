<div
  class="text-[14px] flex flex-col w-[480px] h-[60px] bg-transparent border-preto border-2 rounded-md shadow-none px-2 justify-center">
  @if (showDateTime) {
  <div class="flex flex-row items-center justify-between">
    <span>{{ title }}: {{ name }}</span>
    <button>
      <img class="pt-0.5" src="assets/edit.svg" alt="">
    </button>
  </div>
  <div class="flex flex-row items-center justify-start gap-6">
    <div class="flex flex-row gap-1">
      <img src="assets/calendar.svg" alt="">
      <span>Data: {{ date }}</span>
    </div>
    <div class="flex flex-row gap-1">
      <img src="assets/time.svg" alt="">
      <span>Horário: {{ time }}</span>
    </div>
  </div>
  } @else {
    <div class="flex flex-row items-center justify-between">
      <span>{{ title }}: {{ name }}</span>
      <button>
        <img class="pt-0.5" src="assets/edit.svg" alt="">
      </button>
    </div>
  }
</div>
