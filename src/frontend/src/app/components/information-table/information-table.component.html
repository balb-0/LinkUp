<div class="w-full">
  <div *ngFor="let section of sections" class="mb-8" role="region" [attr.aria-label]="'Seção: ' + section.title">
    <div class="border border-cinzaEscuro rounded-lg bg-cinza p-5" role="table" [attr.aria-label]="'Tabela da seção ' + section.title">
      <h2 class="text-xl font-bold text-preto mb-2">{{ section.title }}</h2>
      <hr class="border-t-2 border-preto w-full mb-4" />

      <!-- Header row -->
      <div class="flex mb-3" role="row">
        <div *ngFor="let column of section.columns" class="flex-1 px-1" role="columnheader">
          <div class="text-preto font-medium">{{ column }}</div>
        </div>
      </div>

      <!-- Data rows -->
      <div *ngIf="section.rows.length > 0">
        <div *ngFor="let row of section.rows" class="flex mb-3" role="row">
          <div *ngFor="let cell of row" class="flex-1 px-1" role="cell">
            <div
              class="bg-branco border border-cinzaEscuro rounded-md px-3 py-2 text-preto shadow-sm"
            >
              {{ cell }}
            </div>
          </div>
        </div>
      </div>

      <!-- Empty rows for user input if needed -->
      <div *ngIf="section.rows.length === 0">
        <div class="flex mb-3" role="row">
          <div *ngFor="let column of section.columns" class="flex-1 px-1" role="cell">
            <div ... [attr.aria-label]="'Campo de entrada vazio para a coluna ' + column"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
