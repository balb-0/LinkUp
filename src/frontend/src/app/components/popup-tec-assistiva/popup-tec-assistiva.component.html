<div class="popup-backdrop" (click)="closeDialog()">
  <div class="popup-content" (click)="$event.stopPropagation()">

    <div class="popup-header">
      <button class="close-button" (click)="closeDialog()">&times;</button>
    </div>

    <div class="popup-body">
      <h2>Selecione a(s) tecnologia(s)</h2>

      <app-drop-down
        class="popup-select"
        [items]="tecnologias"
        (itemSelected)="onTecnologiaSelecionada($event)">
      </app-drop-down>

      <div class="popup-slots" *ngIf="tecnologiasSelecionadas.length > 0">
        <div class="slot-item" *ngFor="let tecnologia of tecnologiasSelecionadas">
          {{ tecnologia }}
          <button class="remove-button" (click)="removerTecnologia(tecnologia)">×</button>
        </div>
      </div>

      <div class="popup-footer">
        <app-date-time-picker></app-date-time-picker>
        <button class="confirm-button" (click)="confirm()">Confirmar</button>
      </div>
    </div>

  </div>
</div>
