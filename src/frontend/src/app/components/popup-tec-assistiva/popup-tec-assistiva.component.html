<div class="popup-backdrop" (click)="closeDialog()">
  <div class="popup-content" (click)="$event.stopPropagation()">

    <div class="popup-header">
      <button class="close-button" [disabled]="processando" (click)="closeDialog()">&times;</button>
    </div>

    <div class="popup-body">
      <h2>Selecione a(s) tecnologia(s)</h2>

      <app-drop-down
        class="popup-select"
        [items]="nomesParaDropdown"
        (itemSelected)="onTecnologiaSelecionada($event)">
      </app-drop-down>

      <div class="popup-slots" *ngIf="tecnologiasSelecionadas.length > 0">
        <div class="slot-item" *ngFor="let nome of tecnologiasSelecionadas">
          {{ nome }}
          <button class="remove-button" [disabled]="processando" (click)="removerTecnologia(nome)">×</button>
        </div>
      </div>

      <div class="popup-footer">
        <button class="confirm-button" [disabled]="processando" (click)="confirm()">
          <span *ngIf="!processando">Confirmar</span>
          <span *ngIf="processando">Processando...</span>
        </button>
      </div>
    </div>

  </div>
</div>
