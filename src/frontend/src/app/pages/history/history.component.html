<div class="container mx-auto p-6">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold">Histórico de Alterações</h1>
    <button 
      (click)="atualizarAgora()" 
      class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded flex items-center"
    >
      <span class="material-icons mr-1">refresh</span>
      Atualizar
    </button>
  </div>
  <p class="mb-4 text-gray-600">Clique em uma linha para ver detalhes completos da alteração.</p>
  <div class="mb-4">
    
  </div>
  <app-table 
    [columns]="colunasDaTabela" 
    [data]="dadosDaTabela"
    [totalItems]="totalDeRegistros"
    [serverPagination]="true"
    [pageSize]="itensPorPagina"
    (pageChange)="mudarPagina($event)"
    (rowClick)="onRowClick($event)">
  </app-table>
</div>
