<!-- Header bar -->
<header class="w-full h-[62px] bg-[#7e0000]"></header>
<div class="bg-[#f6f4f4] flex flex-row justify-center w-full min-h-screen">
    <div class="bg-[#f6f4f4] w-full max-w-[1440px] relative">
      <div class="flex flex-col md:flex-row p-4">
        <!-- Left side with image -->
        <div class="flex-1 flex justify-center items-center p-8">
          <div class="w-[437px] h-[437px] relative">
            <img
              class="w-[437px] h-[279px] mt-[79px]"
              alt="Centro Paula Souza Logo"
              src="/../assets/cps_verm.svg"
            />
          </div>
        </div>
        <!-- Right side with form -->
        <div class="flex-1 flex flex-col items-center">
          <h1 class="mt-[200px] mb-12 !font-poppins !font-bold text-[#333333] text-5xl text-center">
            Cadastro de Usuário
          </h1>
          <div class="w-[462px] border-none bg-transparent">
            <form class="p-0 space-y-6">
              <div class="space-y-2">
                <label
                  for="nome"
                  class="block !font-leagueSpartan !font-semibold text-[#333333] text-2xl"
                >
                  Nome Completo
                </label>
                <input
                  id="nome"
                  class="h-[60px] bg-[#E2E2E2] rounded border-none w-full"
                  name="nome"
                />
              </div>
              <div class="space-y-2">
                <label
                  for="email"
                  class="block !font-leagueSpartan !font-semibold text-[#333333] text-2xl"
                >
                  E-mail
                </label>
                <input
                  id="email"
                  type="email"
                  class="h-[60px] bg-[#E2E2E2] rounded border-none w-full"
                  name="email"
                />
              </div>
              <div class="space-y-2">
                <label
                  for="senha"
                  class="block !font-leagueSpartan !font-semibold text-[#333333] text-2xl"
                >
                  Senha
                </label>
                <input
                  id="senha"
                  type="password"
                  class="h-[60px] bg-[#E2E2E2] rounded border-none w-full"
                  name="senha"
                />
              </div>
              <div class="flex justify-center pt-6">
                <app-button></app-button>
              </div>
            </form>
          </div>
          <!-- Logo at bottom -->
          <div class="mt-16">
            <img src="/../assets/linkup_logo.svg" alt="Linkup Logo" class="w-[243px] h-[55px]" />
          </div>
        </div>
      </div>
    </div>
</div>
