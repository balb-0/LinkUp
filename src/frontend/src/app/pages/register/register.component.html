<!-- Header bar -->
<header class="w-full h-[62px] bg-[#7e0000]"></header>

<div class="bg-[#f6f4f4] flex flex-row justify-center w-full min-h-screen">
  <div class="bg-[#f6f4f4] w-full max-w-[1440px] relative">
    <div class="flex flex-col md:flex-row p-4">
      <!-- Left side with image -->
      <div class="flex-1 flex justify-center items-center p-8">
        <div class="w-[437px] h-[437px] relative">
          <img class="w-[437px] h-[279px] mt-[79px]" alt="Centro Paula Souza Logo" src="/../assets/cps_verm.svg" />
        </div>
      </div>
      <!-- Right side with form -->
      <div class="flex-1 flex flex-col items-center">
        <h1 class="mt-[200px] mb-12 !font-poppins !font-bold text-[#333333] text-5xl text-center">
          Cadastro de Usuário
        </h1>
        <div class="w-[462px] border-none bg-transparent">
          <form [formGroup]="registerForm" (ngSubmit)="onSubmit($event)" class="p-0 space-y-6">
            <div class="space-y-2">
              <label for="nome" class="block text-2xl font-semibold">Nome Completo</label>
              <input id="nome" formControlName="nome" class="h-[60px] bg-[#E2E2E2] rounded border-none w-full"
                type="text" required />
              <div *ngIf="registerForm.controls['nome'].invalid && registerForm.controls['nome'].touched"
                class="text-red-500">
                Nome deve ter pelo menos 3 caracteres.
              </div>
            </div>

            <div class="space-y-2">
              <label for="email" class="block text-2xl font-semibold">E-mail</label>
              <input id="email" formControlName="email" type="email"
                class="h-[60px] bg-[#E2E2E2] rounded border-none w-full" required />
              <div *ngIf="registerForm.controls['email'].invalid && registerForm.controls['email'].touched"
                class="text-red-500">
                Insira um e-mail válido.
              </div>
            </div>

            <div class="space-y-2">
              <label for="senha" class="block text-2xl font-semibold">Senha</label>
              <input id="senha" formControlName="senha" type="password"
                class="h-[60px] bg-[#E2E2E2] rounded border-none w-full" required />
              <div *ngIf="registerForm.controls['senha'].invalid && registerForm.controls['senha'].touched"
                class="text-red-500">
                A senha deve ter pelo menos 6 caracteres.
              </div>
            </div>

            <div class="space-y-2">
              <label for="cargo" class="block text-2xl font-semibold">Cargo</label>
              <select id="cargo" formControlName="cargo" class="h-[60px] bg-[#E2E2E2] rounded border-none w-full"
                required>
                <option value="">Selecione um cargo</option>
                <option value="admin">Admin</option>
                <option value="usuario">Usuário</option>
              </select>
              <div *ngIf="registerForm.controls['cargo'].invalid && registerForm.controls['cargo'].touched"
                class="text-red-500">
                Selecione um cargo.
              </div>
            </div>
            <div class="flex justify-center pt-6">
              <button type="submit" class="!w-[220px] sm:!w-[180px] md:!w-[200px] lg:!w-[220px]
              !h-[60px] sm:!h-[50px] md:!h-[55px] lg:!h-[60px]
              !bg-[#0E6053] hover:!bg-[#0E6053]/90
              !rounded
              !font-poppins !font-bold
              !text-branco
              !text-2xl sm:!text-xl md:!text-2xl">
                Confirmar
              </button>
            </div>
            <p *ngIf="errorMessage" class="text-red-500 text-center mt-4">{{ errorMessage }}</p>
          </form>
        </div>

        <!-- Logo at bottom -->
        <div class="mt-16">
          <img src="/../assets/linkup_logo.svg" alt="Linkup Logo" class="w-[243px] h-[55px]" />
        </div>
      </div>
    </div>
  </div>
</div>
