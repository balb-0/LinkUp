<main class="flex flex-col items-center">
  <h1 class="pt-[35px] text-[30px] font-bold">Profissionais</h1>

  <section class="gap-4 flex mt-6 w-full max-w-7xl">
    <article class="w-[530px] bg-cinza p-6 rounded-lg shrink-0 h-fit">
      <app-professional-registration></app-professional-registration>
    </article>

    <article class="flex-1 min-w-[600px]">
      <app-search-bar (search)="handleSearch($event)"></app-search-bar>
      <app-table
      [data]="tableData"
      [columns]="tableColumns"
      [totalItems]="totalRegistros"
      [serverPagination]="true"
      (pageChange)="onPageEvent($event)">
    </app-table>
    </article>
  </section>
</main>
