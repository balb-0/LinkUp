<!-- Main content -->
<main class="px-16 pt-24 ">
  <!-- Title -->
  <h1 class="text-[40px] font-semibold font-leagueSpartan text-black text-center mb-12">
    Alunos
  </h1>

  <!-- Search controls -->
  <div class="flex justify-center gap-6 mb-16">
    <!-- Select Dropdown -->
    <app-drop-down 
      [width]="223"
      [height]="40"
      [options]="opcoesDropdown" 
      (itemSelected)="onItemSelected($event)"
      placeholder="Selecione uma instituição"
      [items]="opcoesDropdown"
      [selectedItem]="minhaVariavelSelecionada">
    </app-drop-down>
    <!-- Search Input -->
    <app-search-bar 
    class="!w-[755px]"
    (search)="handleSearch($event)"></app-search-bar>
    <!-- Search Button -->
  </div>

  <!-- Table -->
  <div *ngIf="!loading && !error && minhaVariavelSelecionada">
    <app-table
      [columns]="colunasDaTabela"
      [data]="estudantesFiltrados"
      [serverPagination]="false"
      [totalItems]="totalRegistros"
      (pageChange)="onPageEvent($event)">
    </app-table>
  </div>

  <!-- Pagination -->
</main>
