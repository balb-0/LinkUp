<!-- Main content -->
<main class="px-16 pt-24">
  <!-- Title -->
  <h1 class="text-[40px] font-semibold font-leagueSpartan text-black text-center mb-12">
    Alunos
  </h1>

  <!-- Search controls -->
  <div class="flex justify-center gap-6 mb-16">
    <!-- Select Dropdown -->
    <app-drop-down #dropdownRef
      [items]="opcoesDropdown"
      [placeholder]="'Selecione uma opção'"
      [selectedItem]="minhaVariavelSelecionada"
      [width]="'223'"
      [height]="'40'"
      (itemSelected)="onItemSelected($event)">
    </app-drop-down>
    <!-- Search Input -->
    <app-search-bar class="!w-[755px]"></app-search-bar>
    <!-- Search Button -->
  </div>

  <!-- Table -->
  <div class="w-full">
    <div class="grid grid-cols-2">
      <div class="text-center font-leagueSpartan font-bold text-black text-[32px] py-2">Nome</div>
      <div class="text-center font-leagueSpartan font-bold text-black text-[32px] py-2">Unidade</div>
    </div>
    <app-table></app-table>
  </div>

  <!-- Pagination -->
</main>
