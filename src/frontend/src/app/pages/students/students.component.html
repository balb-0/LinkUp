<!-- Main content -->
<main class="px-[16px] pt-[24px]">
  <!-- Title -->
  <h1 class="text-[40px] font-semibold font-leagueSpartan text-black text-center mb-2">
    Alunos
  </h1>

  <p class="!mb-6 text-gray-600 text-center">Clique em uma instituição para visualizar a lista de alunos.</p>

  <!-- Search controls -->
  <div class="flex justify-center gap-6 mb-[16px]">
    <!-- Select Dropdown -->
    <app-drop-down [width]="'223px'" [height]="'40px'" [options]="opcoesDropdown" (itemSelected)="onItemSelected($event)"
      placeholder="Selecione uma instituição" [items]="opcoesDropdown" [selectedItem]="minhaVariavelSelecionada">
    </app-drop-down>
    <!-- Search Input -->
    <app-search-bar
    class="!w-[755px]"
    (search)="handleSearch($event)"></app-search-bar>
    <!-- Search Button -->
  </div>

  <!-- Table -->
  <div *ngIf="!loading && !error && minhaVariavelSelecionada">
    <app-table
      [columns]="colunasDaTabela"
      [data]="estudantesFiltrados"
      [serverPagination]="false"
      [totalItems]="totalRegistros"
      (pageChange)="onPageEvent($event)"
      (rowClick)="navegarParaPerfil($event)">
    </app-table>
  </div>

  <!-- Pagination -->
</main>
